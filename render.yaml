services:
  - type: web
    name: flamesight-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}
    healthCheckPath: /health
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: AI_SERVICE_URL
        value: "https://flamesight.onrender.com"   # hosted /ask (flamesight/ai/Dockerfile); no trailing slash
      - key: DB_PATH
        value: "data/flamesight.db"
      - key: CACHE_TTL_SECONDS
        value: 300
      - key: AI_PROXY_TIMEOUT_SECONDS
        value: 30.0   # Claude-written answers take 6-8 s warm; the AI service's first request after idle ~45 s
      - key: ALLOWED_ORIGINS
        value: "*"
