services:
  - type: web
    name: flamesight-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: AI_SERVICE_URL
        value: ""
      - key: DB_PATH
        value: "data/flamesight.db"
      - key: CACHE_TTL_SECONDS
        value: 300
      - key: TIMEOUT_SECONDS
        value: 10.0
      - key: ALLOWED_ORIGINS
        value: "*"
